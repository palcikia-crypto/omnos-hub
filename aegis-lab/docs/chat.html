<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Чат — работает из РФ</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1420;color:#e8ecf4;margin:0;padding:12px;max-width:760px;margin:0 auto}
h1{font-size:20px}
.card{background:#1a2233;border:1px solid #2a3550;border-radius:12px;padding:12px;margin:10px 0}
.small{color:#8fa0bd;font-size:13px}
a{color:#7dd3fc}
input,select,textarea{background:#0b0f18;border:1px solid #2a3550;border-radius:8px;color:#e8ecf4;padding:10px;font-size:14px;width:100%;box-sizing:border-box}
textarea{resize:none}
.btn{display:inline-block;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;margin:6px 4px 0 0;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sec{background:#1a2233;border:1px solid #2a3550}
#chat{display:flex;flex-direction:column;gap:10px;margin:14px 0;min-height:200px}
.msg{max-width:88%;padding:10px 13px;border-radius:13px;font-size:14.5px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#2563eb;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#1a2233;border:1px solid #2a3550;border-bottom-left-radius:4px}
.msg.err{align-self:center;background:#3a1a22;border:1px solid #7f2d3d;color:#f8b4c0;font-size:13px}
.msg code{background:#0b0f18;border-radius:4px;padding:1px 5px;font-size:13px}
.msg .blk{display:block;background:#0b0f18;border:1px solid #2a3550;border-radius:8px;padding:9px;margin:7px 0;overflow-x:auto;font-family:monospace;font-size:12.5px;white-space:pre}
#compose{display:flex;gap:8px;position:sticky;bottom:8px}
#compose textarea{flex:1}
#send{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:18px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1}
</style>
</head>
<body>
<h1>💬 Gemini Чат</h1>
<p class="small">Работает из РФ без VPN (через твой прокси-воркер). Ключ хранится только в твоём браузере.</p>

<div class="card">
<div class="row"><input id="key" type="password" placeholder="API-ключ Gemini (AIza...)"><select id="model" style="flex:0 0 150px">
<option value="gemini-2.5-flash">2.5 Flash</option>
<option value="gemini-2.5-flash-lite">2.5 Flash-Lite</option>
<option value="gemini-2.0-flash">2.0 Flash</option>
</select></div>
<button class="btn" onclick="saveKey()">💾 Сохранить ключ</button>
<button class="btn sec" onclick="clearChat()">🗑 Очистить чат</button>
<p class="small" id="keyhint" style="margin-top:8px"></p>
</div>

<div id="chat"></div>

<div id="compose">
<textarea id="q" rows="2" placeholder="Спроси что-нибудь… (Enter — отправить)"></textarea>
<button id="send" onclick="ask()">➤</button>
</div>
<p class="small" style="text-align:center">Aegis Lab · <a href="vpn.html">VPN-страница</a> · <a href="index.html">Панель бота</a></p>

<script>
const API = "https://gemini-api.apigemenipp.workers.dev/v1beta/models";
const chat = document.getElementById("chat");
const keyEl = document.getElementById("key");
const modelEl = document.getElementById("model");
const qEl = document.getElementById("q");
let history = [];

const savedKey = localStorage.getItem("gk");
if (savedKey) keyEl.value = savedKey;
const savedModel = localStorage.getItem("gm");
if (savedModel) modelEl.value = savedModel;
modelEl.onchange = () => localStorage.setItem("gm", modelEl.value);
const savedChat = localStorage.getItem("gh");
if (savedChat) {
  history = JSON.parse(savedChat);
  history.forEach(m => addMsg(m.text, m.role === "user" ? "user" : "bot", false));
}
updateHint();

function updateHint(msg) {
  document.getElementById("keyhint").textContent = msg ||
    (keyEl.value ? "Ключ сохранён в этом браузере ✅" : "Нет ключа? Нужен бесплатный ключ Google AI Studio — вставь его и нажми «Сохранить ключ».");
}

function saveKey() {
  const v = keyEl.value.trim();
  if (!v) return;
  localStorage.setItem("gk", v);
  updateHint("Ключ сохранён в этом браузере ✅");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function fmt(s) {
  let out = esc(s);
  out = out.replace(/```([\s\S]*?)```/g, (m, c) => '<code class="blk">' + c.trim() + "</code>");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return out;
}

function addMsg(text, cls, keep = true) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = cls === "err" ? esc(text) : fmt(text);
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  if (keep) {
    history.push({ role: cls === "user" ? "user" : "model", text });
    localStorage.setItem("gh", JSON.stringify(history.slice(-40)));
  }
  return div;
}

function clearChat() {
  history = [];
  localStorage.removeItem("gh");
  chat.innerHTML = "";
}

async function ask() {
  const q = qEl.value.trim();
  const key = keyEl.value.trim();
  if (!q) return;
  if (!key) { addMsg("Сначала вставь API-ключ и нажми «Сохранить ключ».", "err", false); return; }
  qEl.value = "";
  addMsg(q, "user");
  const btn = document.getElementById("send");
  btn.disabled = true;
  const wait = addMsg("Печатает…", "bot", false);
  try {
    const contents = history.map(m => ({ role: m.role, parts: [{ text: m.text }] }));
    const r = await fetch(`${API}/${modelEl.value}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents })
    });
    const j = await r.json();
    if (j.error) {
      const reason = (j.error.status || "") + "";
      if (reason.includes("API_KEY") || (j.error.message || "").toLowerCase().includes("api key"))
        wait.className = "msg err", wait.textContent = "Ключ не подходит. Проверь его и сохрани заново.";
      else if (r.status === 429)
        wait.className = "msg err", wait.textContent = "Слишком много запросов — подожди минуту.";
      else
        wait.className = "msg err", wait.textContent = "Ошибка Google: " + (j.error.message || r.status);
      history.pop();
    } else {
      const ans = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts || [])
        .map(p => p.text || "").join("\n") || "(пустой ответ)";
      wait.className = "msg bot";
      wait.innerHTML = fmt(ans);
      history.push({ role: "model", text: ans });
      localStorage.setItem("gh", JSON.stringify(history.slice(-40)));
    }
  } catch (e) {
    wait.className = "msg err";
    wait.textContent = "Нет соединения с прокси-воркером. Проверь интернет или попробуй позже.";
    history.pop();
  }
  btn.disabled = false;
}

qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
</script>
</body>
</html>
