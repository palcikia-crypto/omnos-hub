name: pm-arb-scan

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Arbitrage scan
        working-directory: polymarket-lab
        run: python arbitrage/ci_scan.py
      - name: Commit scan results
        run: |
          git config user.name "arb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add polymarket-lab/arbitrage/
          git diff --cached --quiet || (git commit -m "auto: arb scan [skip ci]" && git push || (git fetch origin && git rebase origin/main && git push))
