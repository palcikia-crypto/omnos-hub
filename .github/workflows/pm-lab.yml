name: pm-lab

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pm-lab.yml", "polymarket-lab/autolab/lab.py"]

concurrency:
  group: pm-lab
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Research lab (settle + hypotheses)
        working-directory: polymarket-lab
        run: timeout 240 python autolab/lab.py
      - name: Commit lab data
        run: |
          git config user.name "pm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add polymarket-lab/results/
          git diff --cached --quiet || (git commit -m "auto: pm lab [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/main && git push origin HEAD:main && break; done)
