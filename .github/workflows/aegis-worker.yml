name: aegis-worker

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "25 2 * * *"
  push:
    branches: [main]
    paths: ["aegis-lab/src/**", "aegis-lab/config/**", ".github/workflows/aegis-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: aegis-worker-run
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run AEGIS worker
        working-directory: aegis-lab
        run: python -m src.worker
        env:
          WAI_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WAI_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit results
        run: |
          git config user.name "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add aegis-lab/results aegis-lab/docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "aegis: worker cycle update"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push retry $i" && sleep 5
            done
          fi

      - name: Re-arm next cycle
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 240
          gh api -X POST repos/${{ github.repository }}/actions/workflows/aegis-worker.yml/dispatches -f ref=main

  sandbox-train:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: aegis-worker-train
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Optimize (WFO grid) + evolution + sandbox replay + train ML gate
        working-directory: aegis-lab
        run: |
          python -m src.optimize --days 30
          python -m src.evo --minutes 12 --days 30
          python -m src.sim --days 30
          python -m src.train

      - name: Commit model + sim dataset
        run: |
          git config user.name "aegis-bot"
          git config user.email "aegis-bot@users.noreply.github.com"
          git add aegis-lab/results
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "aegis: sandbox replay + train"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push retry $i" && sleep 5
            done
          fi
